<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin - SpaceIt</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <style>
    .link-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .link-actions {
      white-space: nowrap;
    }
    .theme-toggle {
      margin-left: 10px;
    }
        </style>
    </head>
    <body>
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Gerenciar Links</h1>
                <div class="d-flex align-items-center">
                    <div class="theme-toggle">
                        <button class="btn btn-sm" id="theme-toggle-btn">
                            <i class="bi bi-sun-fill" id="theme-icon"></i>
                        </button>
                    </div>
                    <a href="/" class="btn btn-outline-secondary ms-2 me-2">Ver Site</a>
                    <a href="/logout" class="btn btn-outline-danger">Sair</a>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Adicionar/Editar Link</h5>
                </div>
                <div class="card-body">
                    <form id="link-form">
                        <input type="hidden" id="link-id">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="title" class="form-label">Título</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="title"
                                    required
                                >
                            </div>
                            <div class="col-md-6">
                                <label for="url" class="form-label">URL</label>
                                <input
                                    type="url"
                                    class="form-control"
                                    id="url"
                                    required
                                >
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="icon" class="form-label">URL do Ícone</label>
                                <input
                                    type="url"
                                    class="form-control"
                                    id="icon"
                                    required
                                >
                                <small class="text-muted">URL de uma imagem para usar como ícone</small>
                            </div>
                            <div class="col-md-4">
                                <label for="order_num" class="form-label">Ordem</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="order_num"
                                    value="0"
                                >
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" id="cancel-btn" class="btn btn-outline-secondary d-none">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Links Cadastrados</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Ordem</th>
                                    <th>Ícone</th>
                                    <th>Título</th>
                                    <th>URL</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="links-table">
                                <!-- Links serão carregados aqui --></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/public/js/theme.js"></script>
        <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('link-form');
      const cancelBtn = document.getElementById('cancel-btn');
      const linksTable = document.getElementById('links-table');

      // Carregar links
      const loadLinks = async () => {
        try {
          const response = await fetch('/api/links');
          const links = await response.json();

          linksTable.innerHTML = '';

          links.forEach(link => {
            const row = document.createElement('tr');

            row.innerHTML = `
              <td>${link.order_num}</td>
              <td><img src="${link.icon}" alt="${link.title}" class="link-icon"></td>
              <td>${link.title}</td>
              <td><a href="${link.url}" target="_blank">${link.url}</a></td>
              <td class="link-actions">
                <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${link.id}">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${link.id}">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            `;

            linksTable.appendChild(row);
          });

          // Adicionar event listeners para os botões de editar e excluir
          document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => editLink(btn.dataset.id));
          });

          document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteLink(btn.dataset.id));
          });
        } catch (error) {
          console.error('Erro ao carregar links:', error);
        }
      };

      // Salvar link (adicionar ou atualizar)
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('link-id').value;
        const title = document.getElementById('title').value;
        const url = document.getElementById('url').value;
        const icon = document.getElementById('icon').value;
        const order_num = document.getElementById('order_num').value;

        const data = { title, url, icon, order_num };

        try {
          if (id) {
            // Atualizar link existente
            await fetch(`/api/links/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
          } else {
            // Adicionar novo link
            await fetch('/api/links', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
          }

          resetForm();
          loadLinks();
        } catch (error) {
          console.error('Erro ao salvar link:', error);
        }
      });

      // Editar link
      const editLink = async (id) => {
        try {
          const response = await fetch('/api/links');
          const links = await response.json();

          const link = links.find(l => l.id == id);

          if (link) {
            document.getElementById('link-id').value = link.id;
            document.getElementById('title').value = link.title;
            document.getElementById('url').value = link.url;
            document.getElementById('icon').value = link.icon;
            document.getElementById('order_num').value = link.order_num;

            cancelBtn.classList.remove('d-none');
          }
        } catch (error) {
          console.error('Erro ao carregar link para edição:', error);
        }
      };

      // Excluir link
      const deleteLink = async (id) => {
        if (confirm('Tem certeza que deseja excluir este link?')) {
          try {
            await fetch(`/api/links/${id}`, { method: 'DELETE' });
            loadLinks();
          } catch (error) {
            console.error('Erro ao excluir link:', error);
          }
        }
      };

      // Resetar formulário
      const resetForm = () => {
        document.getElementById('link-id').value = '';
        form.reset();
        cancelBtn.classList.add('d-none');
      };

      // Botão cancelar
      cancelBtn.addEventListener('click', resetForm);

      // Carregar links ao iniciar
      loadLinks();
    });
        </script>
    </body>
</html>
