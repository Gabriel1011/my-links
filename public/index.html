<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meus Links</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <style>
    body {
      padding: 20px;
    }
    .link-card {
      transition: transform 0.3s;
      margin-bottom: 20px;
    }
    .link-card:hover {
      transform: translateY(-5px);
    }
    .link-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .card-body {
      display: flex;
      align-items: center;
    }
    .card-text {
      margin-left: 15px;
    }
    .admin-link {
      position: fixed;
      bottom: 10px;
      right: 10px;
      opacity: 0.3;
    }
    .admin-link:hover {
      opacity: 1;
    }
    .theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }
        </style>
    </head>
    <body>
        <div class="theme-toggle">
            <button class="btn btn-sm" id="theme-toggle-btn">
                <i class="bi bi-sun-fill" id="theme-icon"></i>
            </button>
        </div>
        <div class="container">
            <h1 class="text-center mb-4">🔗 Meus Links</h1>
            <div class="row" id="links-container">
                <!-- Links serão carregados aqui --></div>
        </div>
        <a href="/admin" class="admin-link btn btn-sm btn-secondary">Admin</a>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/public/js/theme.js"></script>
        <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Carregar links
      try {
        const response = await fetch('/api/links');
        const links = await response.json();

        const container = document.getElementById('links-container');

        links.forEach(link => {
          const col = document.createElement('div');
          col.className = 'col-md-4 col-sm-6';

          col.innerHTML = `
            <a href="${link.url}" target="_blank" class="text-decoration-none">
              <div class="card link-card">
                <div class="card-body">
                  <img src="${link.icon}" alt="${link.title}" class="link-icon">
                  <h5 class="card-text">${link.title}</h5>
                </div>
              </div>
            </a>
          `;

          container.appendChild(col);
        });
      } catch (error) {
        console.error('Erro ao carregar links:', error);
      }
    });
        </script>
    </body>
</html>
