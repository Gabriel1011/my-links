<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Admin SpaceIt</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-form {
      width: 100%;
      max-width: 330px;
      padding: 15px;
      margin: auto;
    }
    .theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }
        </style>
    </head>
    <body>
        <div class="theme-toggle">
            <button class="btn btn-sm" id="theme-toggle-btn">
                <i class="bi bi-sun-fill" id="theme-icon"></i>
            </button>
        </div>
        <div class="login-form">
            <h1 class="h3 mb-3 fw-normal text-center">Admin SpaceIt</h1>
            <div id="error-message" class="alert alert-danger d-none">
                Usuário ou senha incorretos!
            </div>
            <form action="/login" method="POST">
                <div class="form-floating mb-3">
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Usuário"
                        required
                    >
                    <label for="username">Usuário</label>
                </div>
                <div class="form-floating mb-3">
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required
                    >
                    <label for="password">Senha</label>
                </div>
                <button class="w-100 btn btn-lg btn-primary" type="submit">Entrar</button>
                <p class="mt-3 text-center">
                    <a href="/" class="text-decoration-none">Voltar para a página inicial</a>
                </p>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/public/js/theme.js"></script>
        <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Verificar erro de login
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === '1') {
        document.getElementById('error-message').classList.remove('d-none');
      }
    });
        </script>
    </body>
</html>
